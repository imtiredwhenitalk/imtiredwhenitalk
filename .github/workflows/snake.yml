name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Octokit
        working-directory: .github/snake
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Generate and publish animated snake
        working-directory: .github/snake
        run: node generate.mjs
        env:
          # A PAT (SNAKE_TOKEN) is only needed if you want private contributions included.
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
